name: Release

# 推送 v* 标签时，在各自的系统上打包并发布 Release。
# PyInstaller 不支持交叉编译，Windows 的 exe 必须在 Windows runner 上构建。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 排不到 runner 时宁可失败，也别无限排队把整个发布卡住
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            artifact: imgconvert-windows-x86_64.exe
          - os: ubuntu-latest
            label: linux-x86_64
            artifact: imgconvert-linux-x86_64
          # macos-latest 是 Apple Silicon；Intel 用 macos-15-intel，
          # 老的 macos-13 已经被 GitHub 退役，指过去会一直排不到机器
          - os: macos-latest
            label: macos-arm64
            artifact: imgconvert-macos-arm64.zip
          - os: macos-15-intel
            label: macos-x86_64
            artifact: imgconvert-macos-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Windows / macOS runner 有图形环境，GUI 测试会真的跑；
      # ubuntu runner 没有 DISPLAY，GUI 测试会自动跳过，核心逻辑测试照常执行。
      - name: 跑测试
        run: python -m unittest discover -s tests -v

      - name: 打包
        run: pyinstaller --noconfirm --onefile --windowed --name imgconvert main.py

      # macOS 上 --windowed 出的是 .app 目录，要用 ditto 打包才能保住
      # 可执行权限和符号链接，直接 zip 会让 app 在对方机器上打不开。
      - name: 整理产物
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          case "$RUNNER_OS" in
            Windows) mv dist/imgconvert.exe "$ARTIFACT" ;;
            Linux)   mv dist/imgconvert "$ARTIFACT" ;;
            macOS)   ditto -c -k --keepParent dist/imgconvert.app "$ARTIFACT" ;;
            *)       echo "未知平台 $RUNNER_OS" >&2; exit 1 ;;
          esac
          ls -lh "$ARTIFACT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "${{ github.ref_name }}" \
            --notes "下载对应系统的可执行文件，双击运行，无需安装 Python。

          | 系统 | 文件 |
          | --- | --- |
          | Windows 64 位 | \`imgconvert-windows-x86_64.exe\` |
          | macOS Apple Silicon | \`imgconvert-macos-arm64.zip\` |
          | macOS Intel | \`imgconvert-macos-x86_64.zip\` |
          | Linux 64 位 | \`imgconvert-linux-x86_64\` |

          合成图输出在可执行文件所在目录的 \`out\` 子目录下。用法见 [README](https://github.com/${{ github.repository }}#readme)。

          说明：

          - Linux 版下载后需要 \`chmod +x imgconvert-linux-x86_64\`
          - macOS 版没有做代码签名和公证，首次打开会被 Gatekeeper 拦住。
            解压后在 Finder 里右键选「打开」，或执行
            \`xattr -dr com.apple.quarantine imgconvert.app\`"
